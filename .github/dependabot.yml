version: 2

updates:
  # Go module dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    open-pull-requests-limit: 10

    groups:
      go-dependencies:
        patterns:
          - "*"

    commit-message:
      prefix: "deps"

    labels:
      - dependencies
      - go

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "ci"

    labels:
      - dependencies
      - github-actions
