
name: Go Build Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64

          - goos: windows
            goarch: amd64

          - goos: linux
            goarch: arm64

          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Release
        uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}

          # Use the latest available Go toolchain.
          goversion: latest

          # Force dependency updates before compiling.
          pre_command: |
            rm -f go.sum
            go get -u -t ./...
            go mod tidy
            go mod download

          # Nightly release configuration.
          release_tag: nightly
          overwrite: true

          md5sum: false
          sha256sum: true
