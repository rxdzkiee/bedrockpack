
name: Go Build Binaries

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Latest Stable Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true

      - name: Repair and Update Dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Go Version ==="
          go version

          echo "=== Repair Existing Dependencies ==="
          go mod tidy

          echo "=== Upgrade All Dependencies ==="
          go get -u -t ./...

          echo "=== Regenerate Module Checksums ==="
          go mod tidy

          echo "=== Download Dependencies ==="
          go mod download all

          echo "=== Verify Dependencies ==="
          go mod verify

          echo "=== Updated Module Versions ==="
          go list -m all

      - name: Build and Release
        uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}

          release_tag: nightly
          overwrite: true

          md5sum: false
          sha256sum: true
