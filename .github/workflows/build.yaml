
name: Go Build Binaries

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64

          - goos: windows
            goarch: amd64

          - goos: linux
            goarch: arm64

          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Release
        uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}

          # DO NOT specify goversion: latest.
          # Omitting it automatically installs the latest stable Go.

          pre_command: |
            set -e

            echo "=================================="
            echo "Updating Go dependencies"
            echo "=================================="

            # Regenerate dependency checksums.
            rm -f go.sum

            # Update all direct and indirect dependencies.
            go get -u -t ./...

            # Synchronize module dependencies.
            go mod tidy

            # Download all required modules.
            go mod download

            echo "=================================="
            echo "Updated dependencies:"
            go list -m all
            echo "=================================="

          release_tag: nightly
          overwrite: true

          md5sum: false
          sha256sum: true
